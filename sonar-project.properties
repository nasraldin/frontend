# SonarQube Project Configuration
sonar.host.url=http://sonarqube.test
sonar.projectKey=Frontend
sonar.projectName=Frontend

# SCM Integration Configuration
sonar.scm.provider=git
sonar.links.scm=https://github.com/nasraldin/frontend.git

# Source code location
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.vinxi/**,**/.output/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/google-ai/**,**/google-ai-plans.*

# Test configuration
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/.vinxi/**,**/.output/**

# Test execution report (JUnit XML format)
sonar.testExecutionReportPaths=test-results/junit.xml

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
